# Configuration file

geral {
    # Pausa aleatoria extra entre acoes (ticks), para parecer natural.
    I:actionDelayTicks=10

    # Palavras que identificam uma CAIXA no menu.
    S:boxKeywords <
        caixa
        crate
        box
     >

    # Mod de abrir chaves ligado por padrao.
    B:enabled=true

    # Palavras que identificam uma CHAVE no inventario.
    S:keyKeywords <
        chave
        key
     >

    # Tentativas maximas de abrir o menu antes de desistir.
    I:maxMenuAttempts=5

    # Limite de aberturas por sessao (seguranca contra loop infinito).
    I:maxOpensPerSession=300

    # Comando que abre o menu das caixas.
    S:menuCmd=/caixa

    # Ticks entre tentativas de reabrir o menu.
    I:menuRetryTicks=40

    # Ticks esperando o menu abrir apos o comando.
    I:menuWaitTicks=60

    # Deslocamento minimo (blocos) para considerar o teleporte concluido.
    I:minTeleportDist=12

    # Ticks de espera apos clicar na caixa (animacao/entrega).
    I:openWaitTicks=80

    # Comando digitado no chat para iniciar (nao vai pro servidor).
    S:startCommand=/abrirchaves

    # Comando digitado no chat para parar (nao vai pro servidor).
    S:stopCommand=/pararchaves

    # Ticks (20/s) esperando o teleporte da warp.
    I:teleportWaitTicks=120

    # Comando para ir ate o local das caixas antes de abrir.
    S:warpCmd=/warp caixaars
}


